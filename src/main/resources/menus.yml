# ECIA keeps topology and wording in one validated Paper menu catalog.
# Clicks are typed callbacks in EciaMenuScreens; this file contains no commands.
menus:
  case-names:
    case_daily: "Ежедневный тайник"
    case_weekly: "Недельная реликвия"
    case_rank_artisan: "Кейс Ремесленника"
    case_rank_knight: "Кейс Рыцаря"
    case_furniture: "Дом мастера"
    case_collections: "Сокровищница коллекций"
    case_mounts: "Зверинец маунтов"
  case-name-fallback: "Кейс"
  labels:
    title-history: "История открытий"
    title-pool: "<crate>"
    status-reserved: "Ключ зарезервирован"
    status-choosing: "Результат определяется"
    status-mail: "Готово к получению"
    status-delivering: "Доставка выполняется"
    status-delivered: "Доставлено"
    status-review: "На проверке"
    status-aborted: "Открытие отменено"
  layouts:
    ecia-history:
      schema-version: 1
      rows: 6
      background: { template: background }
      elements:
        info: { slot: 4, template: history-info, kind: decoration }
        previous: { slot: 47, template: previous }
        next: { slot: 51, template: next }
      regions:
        entries: { slots: ['10-16', '19-25', '28-34', '37-43'] }
      pagination: { region: entries, previous: previous, next: next }
    ecia-pool-preview-2:
      schema-version: 1
      rows: 2
      elements:
        previous: { slot: 9, template: previous }
        next: { slot: 17, template: next }
      regions:
        rewards: { slots: ['0-8'] }
        footer: { slots: ['10-16'] }
    ecia-pool-preview-3:
      schema-version: 1
      rows: 3
      elements:
        previous: { slot: 18, template: previous }
        next: { slot: 26, template: next }
      regions:
        rewards: { slots: ['0-17'] }
        footer: { slots: ['19-25'] }
    ecia-pool-preview-4:
      schema-version: 1
      rows: 4
      elements:
        previous: { slot: 27, template: previous }
        next: { slot: 35, template: next }
      regions:
        rewards: { slots: ['0-26'] }
        footer: { slots: ['28-34'] }
    ecia-pool-preview:
      schema-version: 1
      rows: 6
      elements:
        previous: { slot: 45, template: previous }
        next: { slot: 53, template: next }
      regions:
        rewards: { slots: ['0-44'] }
        footer: { slots: ['46-52'] }
  templates:
    background:
      material: GRAY_STAINED_GLASS_PANE
      custom-model-data: 11000
      hide-tooltip: true
      name: "<white> "
    history-info:
      material: BOOK
      name: "<#ffd567>История открытий"
      lore:
        - ""
        - "<#fff2df>Записей: <count>"
        - "<aqua>История доступна только для просмотра"
    history-entry:
      material: CHEST
      name: "<aqua>Награда из истории"
      lore:
        - ""
        - "<#fff2df><state> · ревизия <revision>"
        - "<#ffd567>Только просмотр"
    pool-reward:
      material: CHEST
      name: "<aqua>Награда пула"
      lore:
        - ""
        - "<#fff2df>Шанс: <weight>"
    unavailable:
      material: PAPER
      hide-tooltip: true
      name: "<red>Превью недоступно"
      lore:
        - ""
        - "<#fff2df>Награда скрыта до подтверждения"
    previous:
      material: BLUE_STAINED_GLASS_PANE
      custom-model-data: 11013
      name: "<aqua>« Предыдущая"
      lore:
        - ""
        - "<#8c8c8c>[<aqua>▶<#8c8c8c>] <aqua>ЛКМ<#b8b8b8> — листать"
    next:
      material: BLUE_STAINED_GLASS_PANE
      custom-model-data: 11012
      name: "<aqua>Следующая »"
      lore:
        - ""
        - "<#8c8c8c>[<aqua>▶<#8c8c8c>] <aqua>ЛКМ<#b8b8b8> — листать"
