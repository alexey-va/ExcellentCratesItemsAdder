excellent-crates-directory: plugins/ExcellentCrates/crates
registry-refresh-ticks: 100
preview-command: "excellentcrates preview <crate> <player>"
key-delivery:
  # Exact ARC backend ids. One grant is routed to one backend to prevent duplicates.
  backends: [spawn, survival]
  timeout-ticks: 200
case-holograms:
  enabled: true
  # Defaults. Shift + right-click a case to edit one placed chest.
  # MiniMessage is supported. %crate_name% inserts the configured case name.
  text: "%crate_name%"
  offset-x: 0.0
  height-above-block: 0.18
  offset-z: 0.0
  scale: 2.0
  yaw: 0.0
  pitch: 0.0
  view-range: 1.0
case-roulette:
  offset-x: 0.0
  height-above-block: 2.65
  offset-z: 0.0
  item-spacing: 0.82
  item-scale: 0.95
  winner-scale: 1.32
  pointer-height: 1.08
  pointer-scale: 1.55
  view-range: 24.0
  visible-to-nearby: true
case-ambient:
  # Real reward previews animate around every stationary managed crate.
  enabled: true
  # FOUNTAIN, HALO, CROWN, SPIRAL, PULSE, WHEEL, SWING, INFINITY, SATURN,
  # CAROUSEL, COMET, BLOOM, HELIX, TIDE or CLOCKWORK. Each crate can override it.
  preset: FOUNTAIN
  item-count: 5
  radius: 1.35
  height: 1.05
  item-scale: 0.7
  speed: 1.0
  view-range: 20.0
messages:
  protected: "<red>Этот кейс защищён."
