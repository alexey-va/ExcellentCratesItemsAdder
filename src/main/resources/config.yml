excellent-crates-directory: plugins/ExcellentCrates/crates
registry-refresh-ticks: 100
preview-command: "excellentcrates preview <crate> <player>"
key-delivery:
  # Exact ARC backend ids. One grant is routed to one backend to prevent duplicates.
  backends: [spawn, survival]
  timeout-ticks: 200
case-holograms:
  enabled: true
  # Defaults. Shift + left-click a case to edit one placed chest.
  # MiniMessage is supported. %crate_name% inserts the configured case name.
  text: "%crate_name%"
  offset-x: 0.0
  height-above-block: 0.58
  offset-z: 0.0
  scale: 2.0
  yaw: 0.0
  pitch: 0.0
  view-range: 1.0
case-roulette:
  # Thin camera-facing previews avoid dark undersides. Set false for the old 3D GUI models.
  flat-item-displays: true
  offset-x: 0.0
  height-above-block: 2.65
  offset-z: 0.0
  item-spacing: 0.82
  item-scale: 0.95
  winner-scale: 1.32
  pointer-height: 1.08
  pointer-scale: 1.55
  view-range: 24.0
  visible-to-nearby: true
case-key-glow:
  # Hold the matching native key in the main hand to reveal nearby cases.
  enabled: true
  range: 48.0
  refresh-ticks: 5
case-ambient:
  # Real reward previews animate beside every stationary managed crate.
  enabled: true
  # Keep idle rewards volumetric by default. Set true for thin camera-facing icons.
  flat-item-displays: false
  # FOUNTAIN, HALO, CROWN, SPIRAL, PULSE, WHEEL, SWING, INFINITY, SATURN,
  # CAROUSEL, COMET, BLOOM, HELIX, TIDE, CLOCKWORK, SHOWCASE, REELS, WALL,
  # CONVEYOR, RAIN, TOWER, FAN or SCALES. Each crate can override it.
  preset: SATURN
  item-count: 8
  radius: 1.6
  height: 0.5
  item-scale: 0.5
  speed: 2.0
  view-range: 20.0
messages:
  protected: "<red>Этот кейс защищён."
