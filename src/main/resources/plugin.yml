name: ArcExcellentCrates
version: ${version}
main: ru.ruscrafting.ecia.ArcExcellentCratesPlugin
provides: [ExcellentCratesItemsAdder]
api-version: "1.21"
description: RusCrafting crate integration with protected anchors, display visuals, and durable delivery recovery.
authors: [alexey-va]
depend: [packetevents, ARC]
softdepend: [ExcellentCrates, ItemsAdder, HuskSync, RedisEconomy]
commands:
  cratekeys:
    description: Opens the spawn key merchant's shop.
    usage: /cratekeys
    permission: ecia.use
  arc-crate:
    description: Opens the ArcExcellentCrates administrator center.
    usage: /arc-crate
    permission: ecia.admin
permissions:
  ecia.use:
    description: Allows opening managed crate pedestals and the key merchant.
    default: true
  ecia.admin:
    description: Allows crate placement, visual editing, network key grants, and managed preview reward grants.
    default: op
