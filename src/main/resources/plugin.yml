name: ArcExcellentCrates
version: ${version}
main: ru.ruscrafting.ecia.ArcExcellentCratesPlugin
provides: [ExcellentCratesItemsAdder]
api-version: "1.21"
description: RusCrafting crate integration with protected anchors, display visuals, and durable delivery recovery.
authors: [alexey-va]
softdepend: [ExcellentCrates, ItemsAdder, ARC]
permissions:
  ecia.use:
    description: Allows opening managed crate pedestals.
    default: true
  ecia.admin:
    description: Allows crate placement and per-anchor visual editing.
    default: op
