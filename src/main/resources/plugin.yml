name: ArcExcellentCrates
version: ${version}
main: ru.ruscrafting.ecia.ArcExcellentCratesPlugin
provides: [ExcellentCratesItemsAdder]
api-version: "1.21"
description: RusCrafting crate integration with protected anchors, display visuals, and durable delivery recovery.
authors: [alexey-va]
depend: [packetevents]
softdepend: [ExcellentCrates, ItemsAdder, ARC, HuskSync]
commands:
  arc-crate:
    description: Opens the ArcExcellentCrates administrator center.
    usage: /arc-crate
    permission: ecia.admin
permissions:
  ecia.use:
    description: Allows opening managed crate pedestals.
    default: true
  ecia.admin:
    description: Allows crate placement, visual editing, and network key grants.
    default: op
